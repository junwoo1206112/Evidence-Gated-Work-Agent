services:
  - type: web
    name: evidence-gated-work-agent
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: EGWA_DB_PATH
        value: /tmp/evidence_gated.db
      - key: EGWA_RATE_LIMIT
        value: "30"
      - key: EGWA_TRUST_PROXY
        value: "1"
    # Render Free의 파일시스템은 재배포·재시작 시 초기화될 수 있다.
    # 이 데모의 SQLite 이력은 영속 감사 저장소가 아니다.
